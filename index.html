<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passbook — Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="statusBar" class="status-bar">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText">Connecting to sheet…</span>
    <button id="retryBtn" class="retry-btn hidden">Retry</button>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Passbook</span>
    </div>
  </header>

  <main class="layout">

    <!-- LEFT: Summary -->
    <section class="summary-card">
      <div class="summary-strip"></div>
      <p class="label">Current balance</p>
      <h1 id="balance" class="balance">₹0.00</h1>

      <div class="mini-stats">
        <div class="mini-stat">
          <p class="label">In</p>
          <p id="totalIn" class="mini-value in">₹0.00</p>
        </div>
        <div class="mini-stat">
          <p class="label">Out</p>
          <p id="totalOut" class="mini-value out">₹0.00</p>
        </div>
      </div>

      <div class="chart-wrap">
        <canvas id="categoryChart" width="220" height="220"></canvas>
        <p id="chartEmpty" class="chart-empty">No spending yet</p>
      </div>

      <ul id="chartLegend" class="chart-legend"></ul>
    </section>

    <!-- RIGHT: Form + Ledger -->
    <section class="panel">
      <form id="entryForm" class="entry-form" autocomplete="off">
        <div class="field">
          <label for="description">Description</label>
          <input id="description" type="text" placeholder="Groceries, salary, rent…" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" type="number" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Shopping</option>
              <option>Health</option>
              <option>Salary</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Type</label>
          <div class="type-toggle" role="group" aria-label="Entry type">
            <button type="button" data-type="expense" class="type-btn active">Expense</button>
            <button type="button" data-type="income" class="type-btn">Income</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span class="submit-label">Add entry</span>
          <span class="submit-spinner hidden"></span>
        </button>
      </form>

      <div class="divider"></div>

      <div class="ledger-head">
        <h2>Ledger</h2>
        <span id="entryCount" class="entry-count">0 entries</span>
      </div>

      <ul id="ledgerList" class="ledger-list">
        <!-- rows injected here -->
      </ul>

      <p id="ledgerEmpty" class="ledger-empty hidden">No entries yet — add your first one above.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
